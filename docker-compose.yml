version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: chiyao-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: chiyao_site
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  chiyao-site:
    build: .
    container_name: chiyao-site
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      TZ: Asia/Shanghai
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-root}
      DB_NAME: chiyao_site
      JWT_SECRET: ${JWT_SECRET:-chiyao-tech-jwt-secret-2024}
    volumes:
      - chiyao-uploads:/app/server/uploads
    # 如服务器已有 Nginx 反向代理，可注释掉 ports 直接接入容器网络

volumes:
  mysql-data:
  chiyao-uploads: